<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Royal Paradise Luxury Hotel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <h1 class="brand">Royal Paradise Luxury Hotel</h1>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="rooms.html">Rooms</a>
            <a href="booking.html">Booking</a>
            <a class="active" href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>
</header>

<main>
    <section class="page-banner">
        <p class="section-label">Discover</p>
        <h2>Hotel Gallery</h2>
        <p>A few highlights from Royal Paradise Luxury Hotel.</p>
    </section>

    <section class="gallery-grid section-narrow" aria-label="Hotel photographs">
        <figure class="gallery-item">
            <img src="images/hotel.jpg" alt="Hotel exterior">
            <figcaption>Hotel Exterior</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="images/room1.jpg" alt="Luxury Suite">
            <figcaption>Luxury Suite</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="images/room2.jpg" alt="Deluxe Suite">
            <figcaption>Deluxe Suite</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="images/room3.jpg" alt="Premium Suite">
            <figcaption>Premium Suite</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="images/pool.jpg" alt="Swimming pool">
            <figcaption>Swimming Pool</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="images/restaurant.jpg" alt="Hotel restaurant">
            <figcaption>Restaurant</figcaption>
        </figure>
    </section>
</main>

<footer class="site-footer">
    <p>&copy; 2026 Royal Paradise Hotel. All rights reserved.</p>
</footer>
</body>
</html>
