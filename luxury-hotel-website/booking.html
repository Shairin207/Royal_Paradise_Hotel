<!DOCTYPE html>

<html>

<head>

<title>Hotel Booking</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>Hotel Booking</h1>

</header>



<form action="confirmation.html">


<label>
Full Name:
</label>

<input type="text" required>



<label>
Email:
</label>

<input type="email" required>



<label>
Phone:
</label>

<input type="number" required>



<label>
Room Type:
</label>


<select>

<option>
Luxury Suite
</option>

<option>
Deluxe Suite
</option>

<option>
Premium Suite
</option>

</select>


<p>
Gender
</p>


<input type="radio" name="gender">
Male


<input type="radio" name="gender">
Female




<p>
Facilities Needed
</p>


<input type="checkbox">
Breakfast


<input type="checkbox">
Spa


<input type="checkbox">
Airport Pickup



<br><br>


<label>
Check-in Date:
</label>


<input type="date" required>



<label>
Check-in Time:
</label>


<input type="time" required>
<label>
Check-out Date:
</label>

<input type="date" required>


<label>
Check-out Time:
</label>

<input type="time" required>


<button type="submit">
Confirm Booking
</button>


</form>



</body>

</html>
